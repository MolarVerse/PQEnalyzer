name: CI

on:
  push:
    branches:
      - main
  pull_request: 
    branches:
      - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: build PQEnalyzer
      run: |
        pip install .

    - name: Install GUI test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Generate coverage report
      run: |
        pip install .[test]
        python -m pytest -m "not benchmark and not e2e" --cov=PQEnalyzer --cov-report=xml

    - name: Run GUI and terminal smoke tests
      run: |
        python -m playwright install --with-deps chromium
        xvfb-run -a python -m pytest -m e2e

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        flags: unittests
        verbose: true

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        path: PQEnalyzer
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: PQEnalyzer/PQEnalyzer/web/frontend/package-lock.json
    - name: Install, typecheck, test and build the web frontend
      working-directory: PQEnalyzer/PQEnalyzer/web/frontend
      run: |
        npm ci
        npm test
        npm run build
    - name: Check bundled web assets match the source
      working-directory: PQEnalyzer
      run: |
        git diff --exit-code -- PQEnalyzer/web/static
        test -z "$(git ls-files --others --exclude-standard -- PQEnalyzer/web/static)"
        cmp PQEnalyzer/design/tokens.json PQEnalyzer/web/frontend/node_modules/@molarverse/pq-design/tokens.json
