[build-system]
requires = ["setuptools>=42", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "PQEnalyzer"
dynamic = ["version"]
authors = [
    {name="Josef M. Gallmetzer", email="gallmetzer.josef@gmail.com"},
    {name="Leo Christanell", email="leochristanell@gmail.com"},
    {name="Jakob Gamper", email="97gamjak@gmail.com"}
]
description = "Plot and monitor PQ simulation output."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "PQAnalysis>=1.4.1",
    "beartype",
    "customtkinter",
    "matplotlib",
    "numpy",
    "tk",
    "Pillow",
    "scipy",
    "watchdog",
    "fastapi",
    "uvicorn",
    "rich>=13",
    "rich-argparse>=1.7",
]

[project.urls]
Documentation = "https://molarverse.github.io/PQEnalyzer/"
Repository = "https://github.com/MolarVerse/PQEnalyzer"
Issues = "https://github.com/MolarVerse/PQEnalyzer/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=8,<9",
    "myst-parser>=4,<5",
    "furo>=2024.8.6,<2027",
    "sphinx-copybutton>=0.5,<1",
]
test = [
    "pytest",
    "coverage",
    "pytest-cov",
    "pytest-benchmark",
    "httpx",
    "playwright>=1.55,<2",
]

[tool.setuptools_scm]
version_file = "PQEnalyzer/__version__.py"

[tool.pytest.ini_options]
markers = [
    "benchmark: performance benchmark tests",
    "e2e: end-to-end CLI and GUI smoke tests",
]

[tool.coverage.run]
omit = [
    "PQEnalyzer/_design_terminal.py",
    "PQEnalyzer/__main__.py",
    "PQEnalyzer/__version__.py",
    "PQEnalyzer/apps/*",
    "PQEnalyzer/plots/*",
]

[project.scripts]
pqenalyzer = "PQEnalyzer.__main__:main"

[tool.setuptools.package-data]
PQEnalyzer = [
    "icons/*.png",
    "design/tokens.json",
    "web/static/**/*",
]
